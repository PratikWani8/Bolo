version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: bolo-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: bolo

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: bolo-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - STT_PROVIDER=${STT_PROVIDER:-groq_whisper}
      - TTS_PROVIDER=${TTS_PROVIDER:-gtts}
    volumes:
      - ./ai-service/app/data:/app/app/data
    depends_on:
      - mongodb

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bolo-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/bolo
      - JWT_SECRET=${JWT_SECRET:-bolo_super_secret_jwt_key_2026}
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
      - ai-service

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bolo-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo-data:
